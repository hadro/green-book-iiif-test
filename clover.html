<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Green Book 1947 — Clover IIIF Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    clover-viewer { display: block; height: 100%; }
  </style>
</head>
<body>
  <script>
    var DEFAULT_MANIFEST = "https://hadro.github.io/green-book-iiif-test/manifest.json";

    function decodeContentState(encoded) {
      try {
        var b64 = encoded.replace(/-/g, "+").replace(/_/g, "/");
        while (b64.length % 4) b64 += "=";
        return JSON.parse(atob(b64));
      } catch (e) {
        console.warn("iiif-content decode failed:", e);
        return null;
      }
    }

    // Extract the IIIF Image service base URL from a body's service array
    function serviceId(service) {
      if (!service) return "";
      var s = Array.isArray(service) ? service[0] : service;
      return (s && (s.id || s["@id"])) || "";
    }

    // Build {imageServiceBase → canvasId} index from a fetched manifest
    function buildCanvasIndex(manifest) {
      var index = {};
      for (var canvas of (manifest.items || [])) {
        try {
          var body = canvas.items[0].items[0].body;
          var svc = serviceId(body.service);
          if (svc) index[svc] = canvas.id;
        } catch (e) {}
      }
      return index;
    }

    // Given an old NYPL canvas URL, strip the /full/... suffix to get the
    // image service base so it can be matched against the manifest index.
    // e.g. https://iiif.nypl.org/iiif/3/5207623/full/!760,760/0/default.jpg
    //   → https://iiif.nypl.org/iiif/3/5207623
    function oldCanvasToServiceBase(oldCanvasId) {
      return oldCanvasId.replace(/\/full\/.*$/, "");
    }

    // Clover's iiif-content web-component attribute is broken for base64url
    // content states (github.com/samvera-labs/clover-iiif/issues/312).
    // Workaround: encode the content state as a blob URL and pass it as id.
    // Clover fetches blob URLs via XHR, parses them as IIIF resources, and
    // navigates to the canvas via the same internal p-effect code path.
    function contentStateToBlobId(stateObj) {
      var json = JSON.stringify(stateObj);
      var blob = new Blob([json], { type: "application/json" });
      return URL.createObjectURL(blob);
    }

    var iiifContentParam = new URLSearchParams(window.location.search).get("iiif-content");
    var manifestUrl = DEFAULT_MANIFEST;
    var rawTargetId = "";   // may include #xywh=
    var hasContentState = false;
    var decodedState = null;

    if (iiifContentParam) {
      var state = decodeContentState(iiifContentParam);
      if (state && state.target) {
        decodedState = state;
        var target = state.target;
        // SpecificResource format: canvas id is under target.source.id
        var source = (target.type === "SpecificResource" && target.source) ? target.source : target;
        rawTargetId = (typeof source === "string" ? source : (source.id || ""));
        manifestUrl = (source.partOf && source.partOf[0] && source.partOf[0].id) || DEFAULT_MANIFEST;
        hasContentState = !!rawTargetId;
      }
    }

    var el = document.createElement("clover-viewer");
    // Save reference to currentScript — it becomes null inside async callbacks.
    var insertAnchor = document.currentScript;

    if (!hasContentState) {
      // No content state — just open the manifest at canvas 0.
      el.setAttribute("id", manifestUrl);
      insertAnchor.insertAdjacentElement("afterend", el);
    } else if (
      decodedState &&
      decodedState.id &&
      Array.isArray(decodedState.motivation) &&
      decodedState.target.type === "SpecificResource"
    ) {
      // Already Clover-compatible SpecificResource format — no canvas ID
      // translation needed. Use blob workaround for the iiif-content bug.
      el.setAttribute("id", contentStateToBlobId(decodedState));
      insertAnchor.insertAdjacentElement("afterend", el);
    } else {
      // We have a content state with a (possibly old) NYPL canvas ID.
      // Fetch the manifest, translate the canvas ID, build a proper
      // SpecificResource content state, then serve it as a blob URL.
      fetch(manifestUrl)
        .then(function(r) { return r.json(); })
        .then(function(manifest) {
          var index = buildCanvasIndex(manifest);

          // Split off #xywh= fragment to translate the base canvas ID only
          var fragment = "";
          var oldBase = rawTargetId;
          if (rawTargetId.includes("#")) {
            oldBase = rawTargetId.split("#")[0];
            fragment = "#" + rawTargetId.split("#")[1];
          }

          var svcBase = oldCanvasToServiceBase(oldBase);
          var newCanvasId = index[svcBase] || index[oldBase];

          if (!newCanvasId) {
            // Canvas not found in mapping — manifest may already use correct IDs
            newCanvasId = oldBase;
          }

          // Build a SpecificResource content state matching Clover's own format:
          // top-level id, motivation as array, SpecificResource target with
          // optional FragmentSelector for the xywh region.
          var csTarget = {
            "type": "SpecificResource",
            "source": {
              "id": newCanvasId,
              "type": "Canvas",
              "partOf": [{ "id": manifestUrl, "type": "Manifest" }]
            }
          };
          if (fragment) {
            csTarget["selector"] = {
              "type": "FragmentSelector",
              "value": fragment.slice(1)   // strip leading "#"
            };
          }
          var newState = {
            "@context": "http://iiif.io/api/presentation/3/context.json",
            "id": newCanvasId + (fragment || "") + "/content-state",
            "type": "Annotation",
            "motivation": ["contentState"],
            "target": csTarget
          };

          el.setAttribute("id", contentStateToBlobId(newState));
          insertAnchor.insertAdjacentElement("afterend", el);
        })
        .catch(function(e) {
          console.warn("Canvas ID translation failed:", e);
          // Fall back to opening the manifest at canvas 0.
          el.setAttribute("id", manifestUrl);
          insertAnchor.insertAdjacentElement("afterend", el);
        });
    }
  </script>

  <script src="clover.umd.patched.js"></script>
</body>
</html>
