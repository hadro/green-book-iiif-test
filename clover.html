<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Green Book 1947 — Clover IIIF Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    clover-viewer { display: block; height: 100%; }
  </style>
</head>
<body>
  <!-- Compute manifest ID and insert the element BEFORE Clover's script
       registers the custom element, so the element is already in the DOM
       with the correct id when the upgrade fires. -->
  <script>
    var DEFAULT_MANIFEST = "https://hadro.github.io/green-book-iiif-test/manifest.json";

    function decodeContentState(encoded) {
      try {
        var b64 = encoded.replace(/-/g, "+").replace(/_/g, "/");
        while (b64.length % 4) b64 += "=";
        return JSON.parse(atob(b64));
      } catch (e) {
        console.warn("iiif-content decode failed:", e);
        return null;
      }
    }

    var iiifContent = new URLSearchParams(window.location.search).get("iiif-content");
    var manifestId = DEFAULT_MANIFEST;

    if (iiifContent) {
      var state = decodeContentState(iiifContent);
      if (state && state.target) {
        var target = state.target;
        manifestId = (target.partOf && target.partOf[0] && target.partOf[0].id) || DEFAULT_MANIFEST;
      }
    }

    // Insert the element now — before Clover loads — so it is already in the
    // DOM with the correct id when customElements.define fires the upgrade.
    document.currentScript.insertAdjacentHTML(
      "afterend",
      '<clover-viewer id="' + manifestId.replace(/"/g, "&quot;") + '"></clover-viewer>'
    );
  </script>

  <!-- Load Clover after the element is in the DOM -->
  <script src="https://unpkg.com/@samvera/clover-iiif@3.3.8/dist/web-components/index.umd.js"></script>
</body>
</html>
