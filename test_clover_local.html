<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clover local test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: sans-serif; padding: 1rem; }
    .controls { margin-bottom: 1rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }
    button { padding: 0.4rem 0.8rem; cursor: pointer; }
    #viewer-wrap { height: calc(100vh - 80px); }
    clover-viewer { display: block; height: 100%; }
  </style>
</head>
<body>
  <div class="controls">
    <strong>Test manifest:</strong>
    <button onclick="load('http://localhost:8765/manifest_minimal.json')">Green Book MINIMAL (local)</button>
    <button onclick="load('http://localhost:8765/manifest_local.json')">Green Book full (local)</button>
    <button onclick="load('https://hadro.github.io/green-book-iiif-test/manifest.json')">Green Book (deployed)</button>
    <button onclick="load('https://api.dc.library.northwestern.edu/api/v2/works/8a833741-74a8-40dc-bd1d-c416a3b1bb38?as=iiif')">Northwestern (Clover demo)</button>
    <button onclick="load('https://iiif.wellcomecollection.org/presentation/b18035723')">Wellcome</button>
  </div>
  <div id="viewer-wrap"></div>

  <script>
    function load(manifestUrl) {
      var wrap = document.getElementById("viewer-wrap");
      // Remove old viewer if any
      var old = wrap.querySelector("clover-viewer");
      if (old) old.remove();
      var el = document.createElement("clover-viewer");
      el.setAttribute("id", manifestUrl);
      wrap.appendChild(el);
      console.log("Loading:", manifestUrl);
    }

    // Default: load our manifest on page load
    window.addEventListener("DOMContentLoaded", function() {
      load("http://localhost:8765/manifest_local.json");
    });
  </script>

  <script src="https://unpkg.com/@samvera/clover-iiif@3.3.8/dist/web-components/index.umd.js"></script>
</body>
</html>
